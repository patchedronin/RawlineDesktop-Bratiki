name: Bratiki desktop CI
on:
  push:
    branches: [dev, stable]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Style and boundary checks
        run: |
          python3 -m unittest discover -s script -p test_ui_regressions.py
